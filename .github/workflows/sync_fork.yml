name: Fork Sync

permissions:
  contents: write
  workflows: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: huangxd-/danmu_api
  SYNC_BRANCH: main

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: ${{ env.UPSTREAM_REPO }}
          upstream_sync_branch: ${{ env.SYNC_BRANCH }}
          target_sync_branch: ${{ env.SYNC_BRANCH }}
          test_mode: false

      - name: Sync result
        run: |
          echo "Sync completed: ${{ steps.sync.outputs.has_new_commits }}"
